# List of personal/academic projects
highlighted_projects:
  - name: "Agent Credibility: Actuarial Pricing for AI Agent Deployments"
    git_url: "https://github.com/kaustubhspatil/agent-credibility"
    description: "Tested whether a pooled Buhlmann credibility prior can price AI agent deployments, across three corpora and roughly 40,000 episodes, with 192 tests and every negative control reported. Replicated the governing constant K on two independent corpora sharing no code path (7.6 and 7.0), establishing it as a property of the agent's role rather than an artifact of one dataset. Shipped the result as a PyPI SDK talking to a live bureau service over TLS, and published a downward correction to an early headline finding when a larger corpus contradicted it."

  - name: "agentnorm: Behavioural Monitoring for AI Agents"
    git_url: "https://github.com/kaustubhspatil/agentnorm"
    description: "Published a zero-dependency Python package that monitors how an AI agent behaves at runtime, as opposed to grading offline what it said. Records tool calls, scopes, and result sizes, then flags runs that do not resemble prior benign ones with an explainable verdict. Designed the API to wrap existing tool callables without restructuring or context propagation, and made the anomaly detection cold-start safe so a new agent version is usable before it has history."

  - name: "Credit Scoring: From 0.774 AUROC to a $578M Decision"
    git_url: "https://github.com/kaustubhspatil/credit-scoring-decision-system"
    description: "Built an end-to-end consumer credit scoring system on 307,511 Home Credit applications and 1.7M credit-bureau records, reaching 0.774 test AUROC and converting it into a decision rule worth $578.7M net on the sealed test book. Priced every possible approval rate with a profit curve, verified calibration decile by decile instead of class weighting, mapped all 279 features to lawful adverse-action reasons, and test-fired the PSI drift alarm under a simulated recession. A fairness audit found gender among the model inputs and removed it for 0.0006 AUROC."

  - name: "Deep Learning Equity Signal: The Result That Inverted After Costs"
    git_url: "https://github.com/kaustubhspatil/sp500-quantitative-deep-learning"
    description: "Benchmarked feedforward, LSTM, CNN, and transfer-learning models against a systematic desk's incumbent signal across 48 S&P 500 stocks and 259,073 rows, then charged realistic 10bps trading costs, which inverted the ranking: the incumbent's 159x annual turnover turned a positive gross Sharpe into -0.30 net. Proved leak-freedom by recomputation rather than assertion, fixed an honest accuracy ceiling from return autocorrelation before modeling, and recommended iterating rather than deploying because the best network still lost to equal-weight buy-and-hold."

  - name: "Biological Network Analysis & Protein Kinase Inhibition in Breast Cancer"
    git_url: "https://scholar.google.ca/citations?view_op=view_citation&hl=en&user=Gt5kbUMAAAAJ&citation_for_view=Gt5kbUMAAAAJ:u5HHmVD_uO8C"
    description: "Led a peer-reviewed bioinformatics study on protein kinase inhibition networks in breast cancer. Designed the experimental approach, performed network analysis on protein interaction data, validated findings against published literature, and authored the manuscript as lead author through to publication."

