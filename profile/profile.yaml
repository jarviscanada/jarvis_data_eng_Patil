# List of personal/academic projects
highlighted_projects:
  - name: "Scalable VPC Architecture on AWS"
    git_url: "https://github.com/kaustubhspatil/Scalability-of-VPC-Architecture-on-AWS"
    description: "Designed and deployed a modular, scalable, and secure virtual network on AWS using Amazon VPC. Implemented public and private subnets across multiple availability zones, configured NAT gateways, route tables, and security groups, and applied infrastructure-as-code principles so the production-ready network foundation can be provisioned repeatably. Reinforced the architecture patterns covered by the AWS Solutions Architect - Associate certification."

  - name: "CI/CD Automation with DevOps Tools"
    git_url: "https://github.com/kaustubhspatil/CI-CD-Automation-with-DevOps-Tools"
    description: "Built a fully automated end-to-end CI/CD pipeline integrating Jenkins for orchestration, SonarQube for static code analysis, JFrog Artifactory for artifact management, and Docker with Kubernetes for containerized deployment. Instrumented the pipeline with Prometheus and Grafana for build-health monitoring and alerting, demonstrating a production-grade DevOps workflow from commit to deployment."

  - name: "Biological Network Analysis & Protein Kinase Inhibition in Breast Cancer"
    git_url: "https://scholar.google.ca/citations?view_op=view_citation&hl=en&user=Gt5kbUMAAAAJ&citation_for_view=Gt5kbUMAAAAJ:u5HHmVD_uO8C"
    description: "Led a peer-reviewed bioinformatics study on protein kinase inhibition networks in breast cancer. Designed the experimental approach, performed network analysis on protein interaction data, validated findings against published literature, and authored the manuscript as lead author through to publication."

