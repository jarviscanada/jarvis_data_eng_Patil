# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # Keywords: CentOS, Bash/Shell, Docker, RDBMS/SQL/PostgreSQL, crontab, data analytics
    description: "Designed and implemented a Linux Cluster Monitoring Agent in Bash to collect hardware specs and real-time resource usage from CentOS servers. Provisioned a PostgreSQL database in Docker for persistent storage of node metrics, and automated scheduled collection through crontab. Wrote SQL analytical queries to surface cluster utilization trends and capacity-planning insights, with the full agent and database containerized for reproducible deployment."

  - name: "SQL Data Analytics"
    git_url: "/sql"
    # Keywords: PostgreSQL, normalization, SQL, joins, aggregations, window functions, Docker, DBeaver
    description: "Designed a normalized PostgreSQL schema (1NF, 2NF, 3NF) to model a transactional dataset, and implemented data analytics through complex SQL queries involving joins, aggregations, subqueries, and window functions. Provisioned the database with Docker and explored it through DBeaver, producing reproducible analytical workflows and validating query results against expected business metrics."

  - name: "Python Data Analytics"
    git_url: "/python_data_anlytics"
    # Keywords: Python, Pandas, NumPy, Plotly, Jupyter, ETL, data cleaning, EDA
    description: "Developed an end-to-end analytical pipeline in Python on the U.S. CFPB Consumer Complaint Database (1.28M rows, 5,275 firms, 2011-2019). Performed data profiling, cleaning, and feature engineering with Pandas, including time-series, lag, and company-tier features. Built interactive Plotly dashboards covering market concentration, product mix shift, and a seven-dimension Bureau Accountability Scorecard. Validated outputs against published CFPB statistics and documented a Spark/Databricks migration roadmap."

